[workspace]
members = ["client", "server", "shared"]
resolver = "2"

# La traccia chiede esplicitamente di curare il consumo di CPU e la dimensione
# dell'eseguibile: questo profilo riduce sensibilmente entrambi.
#   - lto / codegen-units = 1 -> il linker elimina il codice morto delle dipendenze
#   - strip = true            -> rimuove i simboli di debug dal binario finale
#   - opt-level = 3           -> codice piu' veloce (meno tempo di CPU a runtime)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
