[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
serde_json = "1.0"
eframe = "0.36"
walkers = "0.58"

# Solo le feature necessarie: il client non ha bisogno dello scheduler
# multi-thread, gli basta un runtime a thread singolo per la rete.
tokio = { version = "1.37", features = ["rt", "net", "io-util", "sync", "time"] }
