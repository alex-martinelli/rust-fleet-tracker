[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
eframe = "0.36"
walkers = "0.58"

# Si abilitano solo le feature effettivamente usate: meno codice compilato,
# eseguibile piu' piccolo.
tokio = { version = "1.37", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "fs",
    "signal",
] }

# `default-features = false` disattiva rayon (feature "multithread"): al server
# serve solo leggere l'uso di CPU del proprio processo.
sysinfo = { version = "0.30", default-features = false }

